<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="page-login">
<script>(function(){try{if(localStorage.getItem("eduBloomSidebarCollapsed")==="1"){document.documentElement.classList.add("sidebar-collapsed-init");}}catch(e){}})();</script>
<div class="auth">
<aside class="auth__brand">
  <a class="logo logo--light" href="index.html" aria-label="EduBloom home"><span class="logo__mark" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><rect class="mark__bg" width="32" height="32" rx="8"/><path class="mark__stem" d="M16 26V16.5" fill="none" stroke-width="2" stroke-linecap="round"/><path class="mark__leaf" d="M16 16.5c0-4.9 3.5-8.5 9.5-8.5 0 5.5-3.5 8.5-9.5 8.5z"/><path class="mark__leaf mark__leaf--soft" d="M16 20c0-3.8-2.7-6.5-7.8-6.5 0 4.2 2.7 6.5 7.8 6.5z"/></svg></span><span class="logo__word">EduBloom</span></a>
  <div class="auth__pitch">
    <p class="auth__tagline">Learn, Grow, Achieve</p>
    <ul class="auth__points">
      <li><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span>Browse and enroll in available courses</span></li>
      <li><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span>Track completed and pending modules</span></li>
      <li><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span>Download a certificate when you finish</span></li>
    </ul>
  </div>
  <svg class="auth__leaf" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><path d="M100 196V104" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M100 104C100 48 142 8 198 8 198 68 156 104 100 104Z" fill="currentColor"/><path d="M100 140C100 96 66 62 10 62 10 110 44 140 100 140Z" fill="currentColor" fill-opacity=".6"/></svg>
</aside>
<main class="auth__panel" id="main">
  <div class="auth__card">
    <a href="index.html" class="back-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg><span>Back to Home</span></a>

    <h1 class="auth__title">Login Portal</h1>

    <div class="segmented tabs" role="group" aria-label="Login as">
      <button class="active" id="studentBtn" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg><span>Student</span></button>
      <button id="adminBtn" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Admin</span></button>
    </div>

    <p class="role-text" id="role">Student Login</p>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter Email" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password">
      </div>

      <div class="field-row field-row--end">
        <a class="text-link" href="forgot_password.html">Forgot Password?</a>
      </div>

      <button type="button" class="btn btn--primary btn--lg btn--block login-btn">Login</button>
    </form>

    <div class="register">
      <h3 id="registerTitle">New Student?</h3>
      <p id="registerText">Don't have a student account?</p>
      <a href="student_register.html" id="registerLink" class="btn btn--outline btn--block">Student Register</a>
    </div>
  </div>
</main>
</div>
<script type="module" src="js/login.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
